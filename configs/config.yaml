app:
  env: prod
  addr: ":8080"

# 数据库连接参数
database:
  host: "127.0.0.1"
  port: "3306"
  user: ""
  # 数据库密码加密时格式为 crcb:<密文>|<私钥>
  password: ""
  dbname: ""
  charset: "utf8mb4"
  parseTime: true
  loc: "Local"

# 弱读备库
databaseReadonly:
  host: "127.0.0.1"
  port: "3306"
  user: ""
  # 数据库密码加密时格式为 crcb:<密文>|<私钥>
  password: ""
  dbname: ""
  charset: "utf8mb4"
  parseTime: true
  loc: "Local"
  sessionVariables: "ob_read_consistency=Weak"

zentao:
  # 禅道地址
  url: ""
  # 对齐禅道 config->requestType
  requestType: PATH_INFO
  # 禅道 API 地址
  api: ""
  account: ""
  password: ""

session:
  cookieName: workbench_sid
  lifetimeHours: 2
  # 是否开启https
  cookieSecure: true

log:
  level: debug
  dir: logs

layout:
  # 导航样式 sidebar(侧边导航) | top(顶部导航)
  nav: sidebar
