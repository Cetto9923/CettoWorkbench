{{ define "schedule/integrated_modal" }}
<div class="batch-modal-overlay" id="scheduleIntegratedModalOverlay"></div>
<div class="batch-modal schedule-integrated-modal" id="scheduleIntegratedModal">
  <div class="batch-modal-hdr">
    <h3 id="scheduleIntegratedModalTitle">排期一体化办理</h3>
    <button type="button" class="drawer-close ui-close-btn" id="scheduleIntegratedModalCloseBtn"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="batch-modal-body" id="scheduleIntegratedModalBody">
    <div class="schedule-modal-info">
      <div class="schedule-modal-title" id="scheduleIntegratedReqTitle">—</div>
      <div class="schedule-modal-summary">
        <span>主系统 <strong id="scheduleIntegratedReqSystem">—</strong></span>
        <span>指派人 <strong id="scheduleIntegratedReqOwner">—</strong></span>
      </div>
    </div>

    <div class="schedule-integrated-section">
      <div class="schedule-integrated-section-hdr"><strong>需求排期</strong></div>
      <div class="schedule-integrated-section-body">
        <div class="schedule-integrated-form-sheet">
          <div class="schedule-integrated-grid">
            <div class="schedule-integrated-cell">
              <label class="schedule-integrated-label">版本窗口 <span class="req">*</span></label>
              <div class="schedule-window-combo">
                <select id="scheduleIntegratedWindowSelect" class="form-select schedule-field-control schedule-window-combo-select">
                  <option value="">请选择版本窗口</option>
                </select>
                <button type="button" class="action-btn js-schedule-inline-create">新建窗口</button>
              </div>
            </div>
            <div class="schedule-integrated-cell">
              <label class="schedule-integrated-label">预计上线</label>
              <div class="schedule-target-combo">
                <input type="date" id="scheduleIntegratedSchedulePlanDate" class="form-input schedule-field-control schedule-target-combo-date" readonly>
              </div>
            </div>
            <div class="schedule-integrated-cell">
              <label class="schedule-integrated-label" for="scheduleIntRDInput">开发负责人</label>
              <input
                type="text"
                id="scheduleIntRDInput"
                class="form-input schedule-field-control"
                placeholder="输入姓名或工号搜索"
                autocomplete="off"
              >
              <input type="hidden" id="scheduleIntRDValue" name="rd">
            </div>
            <div class="schedule-integrated-cell">
              <label class="schedule-integrated-label" for="scheduleIntQDInput">测试负责人</label>
              <input
                type="text"
                id="scheduleIntQDInput"
                class="form-input schedule-field-control"
                placeholder="输入姓名或工号搜索"
                autocomplete="off"
              >
              <input type="hidden" id="scheduleIntQDValue" name="qd">
            </div>
            <div class="schedule-integrated-cell">
              <label class="schedule-integrated-label" for="scheduleIntAccepterInput">验收负责人</label>
              <input
                type="text"
                id="scheduleIntAccepterInput"
                class="form-input schedule-field-control"
                placeholder="输入姓名或工号搜索"
                autocomplete="off"
              >
              <input type="hidden" id="scheduleIntAccepterValue" name="accepter">
            </div>
            <div class="schedule-integrated-cell">
              <label class="schedule-integrated-label">提测/开发</label>
              <input type="date" id="scheduleIntegratedDevelopFinish" class="form-input schedule-field-control">
            </div>
            <div class="schedule-integrated-cell">
              <label class="schedule-integrated-label">测试完成</label>
              <input type="date" id="scheduleIntegratedTestFinish" class="form-input schedule-field-control">
            </div>
            <div class="schedule-integrated-cell">
              <label class="schedule-integrated-label">验收完成</label>
              <input type="date" id="scheduleIntegratedAcceptancedDate" class="form-input schedule-field-control">
            </div>
            <div class="schedule-integrated-cell schedule-integrated-cell--pad" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="schedule-integrated-section" id="scheduleIntegratedRdSection">
      <div class="schedule-integrated-section-hdr schedule-integrated-section-hdr--actions">
        <div><strong>研发需求与任务</strong></div>
      </div>
      <div class="schedule-integrated-section-body">
        <div class="transfer-dev-section">
          <div class="transfer-dev-section-head"><strong>用户故事条目</strong></div>
          <table class="transfer-dev-story-table">
            <thead>
              <tr>
                <th style="width:56px">序号</th>
                <th style="width:120px">角色</th>
                <th>目标和值</th>
                <th style="width:120px">涉及系统</th>
                <th style="width:132px">负责团队</th>
                <th style="width:72px">故事点</th>
              </tr>
            </thead>
            <tbody id="storyItemsBody"></tbody>
          </table>
        </div>
        <div id="rdTaskTree" class="rd-task-tree">
          <div class="transfer-dev-section-head"><strong>研发需求</strong></div>
          <div id="rdTreeEmpty" class="integrated-rd-tree-empty compact" style="display:none;">
            <p>暂无研发需求</p>
          </div>
          <div id="rdTreeNodes"></div>
          <button type="button" class="rd-add-node">+ 添加研发需求</button>
        </div>
      </div>
    </div>
  </div>
  <div class="batch-modal-footer schedule-integrated-footer">
    <button type="button" class="action-btn" id="scheduleIntegratedModalDismissBtn">取消</button>
    <button type="button" class="action-btn primary" id="scheduleIntegratedSaveBtn">确认并同步</button>
  </div>
</div>

<div class="batch-modal-overlay" id="scheduleProductNoticeOverlay"></div>
<div class="batch-modal schedule-product-notice-modal" id="scheduleProductNoticeModal">
  <div class="batch-modal-hdr">
    <h3>系统维护提示</h3>
    <button type="button" class="drawer-close ui-close-btn" id="scheduleProductNoticeCloseBtn"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="batch-modal-body">
    <p id="scheduleProductNoticeMessage" class="schedule-product-notice-message"></p>
    <div class="batch-modal-footer">
      <button type="button" class="action-btn action-btn--primary" id="scheduleProductNoticeOkBtn">确定（去禅道）</button>
      <button type="button" class="action-btn" id="scheduleProductNoticeCancelBtn">取消</button>
    </div>
  </div>
</div>
{{ end }}
