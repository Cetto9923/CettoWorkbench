{{ define "po/deliver_modal" }}
<div id="poDeliverModalOverlay" class="batch-modal-overlay po-deliver-modal-overlay" aria-hidden="true">
  <div id="poDeliverModal" class="batch-modal po-deliver-modal" role="dialog" aria-modal="true" aria-labelledby="poDeliverModalTitle">
    <div class="batch-modal-hdr">
      <h3 id="poDeliverModalTitle">发起交付</h3>
      <button type="button" class="po-deliver-close-btn" id="poDeliverCloseBtn" aria-label="关闭">&times;</button>
    </div>

    <!-- 加载与错误状态 -->
    <div id="poDeliverLoadingState" class="demand-clarify-loading">
      <div class="clarify-spinner"></div>
      <p>正在加载交付信息与前置检查…</p>
    </div>
    <div id="poDeliverErrorState" class="demand-clarify-error-state" style="display:none;">
      <p id="poDeliverErrorMsg">加载失败，请稍后重试</p>
      <button type="button" class="table-action-btn primary" id="poDeliverRetryBtn">重新加载</button>
    </div>

    <!-- 表单正文 -->
    <form id="poDeliverForm" style="display:none;" novalidate>
      <div class="batch-modal-body" id="poDeliverModalBody">
        <!-- 前置检查区 -->
        <div class="vf-section" id="poDeliverPrecheckSection">
          <div class="vf-section-title">交付前置检查</div>
          <div class="ad-checklist po-deliver-checklist" id="poDeliverChecklist"></div>
          <div class="hint" id="poDeliverPrecheckHint">请确认以上前置条件无误后再填写交付信息并提交。</div>
          <div class="error" id="poDeliverPrecheckError" style="display:none;"></div>
        </div>

        <!-- 交付信息区 -->
        <div class="vf-section">
          <div class="vf-section-title">交付信息</div>
          <div class="ad-form-grid po-deliver-grid">
            <div class="ad-field full">
              <label>上线窗口 <span class="ad-req">*</span></label>
              <select class="ad-input" id="poLaunchWindowSelect" required>
                <option value="">请选择上线窗口</option>
              </select>
              <div class="po-launch-window-notice hint" id="poLaunchWindowNotice" style="display:none;"></div>
              <div class="po-launch-date-field" id="poLaunchDateFieldWrap" style="display:none;">
                <label>上线时间 <span class="ad-req">*</span></label>
                <input type="date" class="ad-input" id="poLaunchDate">
              </div>
            </div>

            <div class="ad-field">
              <label>快速评审</label>
              <div class="checks">
                <label><input type="radio" name="poDeliverCarReview" value="1"> 是</label>
                <label><input type="radio" name="poDeliverCarReview" value="0" checked> 否</label>
              </div>
            </div>

            <div class="ad-field">
              <label>灰度验证计划 <span class="ad-req">*</span></label>
              <select class="ad-input" id="poDeliverGrayPlan" required>
                <option value="">请选择</option>
                <option value="1">是</option>
                <option value="0" selected>否</option>
              </select>
            </div>

            <div class="ad-field">
              <label>生产验证时间 <span class="ad-req">*</span></label>
              <select class="ad-input" id="poDeliverVerifyDate" required>
                <option value="">请选择</option>
                <option value="1" selected>当日验证</option>
                <option value="2">次日验证</option>
                <option value="3">首笔验证</option>
              </select>
            </div>

            <div class="ad-field full">
              <label>生产验证计划 <span class="ad-req">*</span></label>
              <textarea class="ad-input" id="poDeliverVerifyPlan" rows="4" required placeholder="请填写上线后生产验证范围、步骤与通过标准"></textarea>
            </div>

            <div class="ad-field full">
              <label>生产验证责任人 <span class="ad-req">*</span></label>
              <div id="poDeliverVerifierHost" class="po-deliver-verifier-host">
                <div class="ui-autocomplete">
                  <input type="text" id="poDeliverVerifierInput" class="ad-input" placeholder="输入姓名或工号搜索" autocomplete="off">
                  <input type="hidden" id="poDeliverVerifierValue" required>
                </div>
              </div>
            </div>
          </div>
          <div class="hint">带 <span class="ad-req">*</span> 为必填。提交后需求进入「待发布」，并同步关联研发需求交付/验证信息。</div>
        </div>
      </div>

      <div class="batch-modal-footer wb-detail-footer" id="poDeliverModalFooter">
        <button type="button" class="action-btn" id="poDeliverCancelBtn">取消</button>
        <button type="submit" class="action-btn primary write-action" id="poDeliverConfirmBtn">保存</button>
      </div>
    </form>
  </div>
</div>
{{ end }}
