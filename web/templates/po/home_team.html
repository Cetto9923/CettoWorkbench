{{ define "page_css" }}
<link rel="stylesheet" href="{{ asset "/static/css/po/personal-workspace.css" }}">
<link rel="stylesheet" href="{{ asset "/static/css/agileteam/agileteam.css" }}">
{{ end }}

{{ define "content" }}
<div class="po-personal-workspace po-home po-team-home">
  <header class="workspace-header">
    <div class="workspace-header-left">
      <div class="po-role-badge" role="group" aria-label="工作视角">
        {{ if .CanViewDemandHome }}<a class="home-view-link" href="/home?view=demand">需求管理</a><span aria-hidden="true">/</span>{{ end }}
        <strong aria-current="page">团队管理</strong>
      </div>
    </div>
    <div class="header-quick-filters" id="teamHomeScopeSwitch" role="group" aria-label="团队查看范围">
      <button type="button" class="header-quick-chip active" data-scope="team">敏捷团队</button>
      <button type="button" class="header-quick-chip" data-scope="dept">部门团队</button>
    </div>
  </header>

  <section class="home-page-card at-scope-card" id="teamHomeScopeCard" aria-label="选择团队范围">
    <label class="at-scope-label" for="teamHomeGroupSelect">查看范围</label>
    <select id="teamHomeGroupSelect" class="at-field">
      <option value="">全部可见团队/小组</option>
    </select>
    <span class="at-scope-tip" id="teamHomeScopeHint">按你的部门负责人或敏捷教练授权范围展示</span>
  </section>

  <section class="home-page-card" aria-labelledby="teamHomeGroupsTitle">
    <div class="home-action-header">
      <div class="home-action-title-group">
        <i class="fas fa-people-group text-blue" aria-hidden="true"></i>
        <h2 class="home-action-title" id="teamHomeGroupsTitle">授权范围内的敏捷团队与小组</h2>
      </div>
      <span class="home-action-subtip" id="teamHomeUpdatedAt">正在加载…</span>
    </div>
    <div class="table-scroll-container">
      <table class="workspace-table">
        <thead><tr><th>敏捷团队/小组</th><th>层级</th><th>正式成员</th><th>待确认调整</th><th>状态</th></tr></thead>
        <tbody id="teamHomeGroupRows"><tr><td colspan="5" class="state-placeholder">正在加载授权范围…</td></tr></tbody>
      </table>
    </div>
    <div class="state-placeholder error" id="teamHomeError" hidden role="alert">
      <span id="teamHomeErrorText">团队数据暂不可用</span>
      <button type="button" class="retry-btn" id="teamHomeRetry">重试</button>
    </div>
  </section>
</div>
{{ end }}

{{ define "page_js" }}
<script src="{{ asset "/static/js/po/home-team.js" }}"></script>
{{ end }}
