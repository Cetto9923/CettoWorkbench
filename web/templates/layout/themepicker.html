{{ define "layout/themepicker" }}
<div class="theme-picker-group" role="group" aria-label="外观设置">
  <div class="dropdown-header">外观</div>
  <button type="button" class="dropdown-item" role="menuitemradio" aria-checked="false" data-theme-value="system">
    <i class="fas fa-circle-half-stroke"></i><span>跟随系统</span>
    <i class="fas fa-check check-mark"></i>
  </button>
  <button type="button" class="dropdown-item" role="menuitemradio" aria-checked="false" data-theme-value="light">
    <i class="fas fa-sun"></i><span>浅色</span>
    <i class="fas fa-check check-mark"></i>
  </button>
  <button type="button" class="dropdown-item" role="menuitemradio" aria-checked="false" data-theme-value="dark">
    <i class="fas fa-moon"></i><span>深色</span>
    <i class="fas fa-check check-mark"></i>
  </button>
</div>
<div class="dropdown-divider"></div>
{{ end }}
