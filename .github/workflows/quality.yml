name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run required regression gates
        run: make check
