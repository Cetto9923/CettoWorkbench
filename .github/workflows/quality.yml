name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run required regression gates
        run: make check
      - name: Run gate self-tests
        run: make check-gates

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ 'workbench_ci_root' }}
          MYSQL_DATABASE: workbench_test
          MYSQL_USER: workbench
          MYSQL_PASSWORD: ${{ 'workbench_ci' }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run isolated MySQL integration tests
        env:
          WB_TEST_MYSQL_DSN: workbench:workbench_ci@tcp(127.0.0.1:3306)/workbench_test?charset=utf8mb4&parseTime=True&loc=Local
        run: go test -tags=integration -count=1 ./tests/integration
