<div class="po-personal-workspace po-done">
  <header class="workspace-header">
    <div class="workspace-header-left">
      <h2>我的已办</h2>
      <p>查看由我推进、确认、流转或结项的历史事项及动作记录</p>
    </div>
  </header>

  
  <div class="wb-done-summary" id="doneSummaryCards" role="region" aria-label="已办指标统计">
    <button type="button" class="wb-done-kpi" data-range="today">
      <span class="wb-done-kpi-dot"></span>
      <span class="wb-done-kpi-label">今日已办</span>
      <strong id="kpiToday">0</strong>
      <span class="wb-done-kpi-tip">今天实际完成的业务动作</span>
    </button>
    <button type="button" class="wb-done-kpi" data-range="week">
      <span class="wb-done-kpi-dot"></span>
      <span class="wb-done-kpi-label">本周已办</span>
      <strong id="kpiWeek">0</strong>
      <span class="wb-done-kpi-tip">本周累计办理</span>
    </button>
    <button type="button" class="wb-done-kpi" data-range="30d">
      <span class="wb-done-kpi-dot"></span>
      <span class="wb-done-kpi-label">近 30 天</span>
      <strong id="kpiMonth">0</strong>
      <span class="wb-done-kpi-tip">近 30 天累计办理</span>
    </button>
    <button type="button" class="wb-done-kpi" data-range="objects" style="cursor:default">
      <span class="wb-done-kpi-dot"></span>
      <span class="wb-done-kpi-label">涉及对象</span>
      <strong id="kpiObjects">0</strong>
      <span class="wb-done-kpi-tip">当前条件下去重对象数</span>
    </button>
  </div>

  <section class="workspace-panel">
    
    <div class="wb-done-domains" id="doneObjectChips" role="group" aria-label="操作对象过滤">
      
    </div>

    
    <div class="workspace-toolbar wb-done-toolbar">
      <div class="wb-done-seg-set" role="group" aria-label="操作范围">
        <button type="button" class="wb-done-seg active" data-mode="core">核心已办</button>
        <button type="button" class="wb-done-seg" data-mode="all">全部操作</button>
      </div>

      <label class="workspace-search">
        <span aria-hidden="true">⌕</span>
        <input type="search" id="doneKeyword" placeholder="搜索标题、对象ID、操作内容..." aria-label="关键词">
      </label>

      <select id="doneTimeRange" class="wb-done-select" aria-label="处理时间">
        <option value="all" selected>全部时间</option>
        <option value="today">今天</option>
        <option value="7d">近 7 天</option>
        <option value="week">本周</option>
        <option value="30d">近 30 天</option>
        <option value="month">本月</option>
        <option value="lastMonth">上月</option>
        <option value="quarter">本季度</option>
      </select>

      <select id="doneAction" class="wb-done-select" aria-label="处理动作">
        <option value="">全部操作</option>
      </select>

      <select id="doneResult" class="wb-done-select" aria-label="处理结果">
        <option value="">全部结果</option>
      </select>

      <select id="doneProject" class="wb-done-select" aria-label="所属项目">
        <option value="">全部项目</option>
      </select>

      <button type="button" class="workspace-btn" id="doneResetBtn">清除筛选</button>
    </div>

    
    <div class="table-scroll-container">
      <table class="workspace-table done-table wb-done-table" id="doneTable">
        <thead>
          <tr>
            <th style="width:130px">处理时间</th>
            <th style="width:120px">对象</th>
            <th>标题</th>
            <th style="width:130px">我做了什么</th>
            <th style="width:90px">处理结果</th>
            <th style="width:150px">状态变化</th>
            <th style="width:180px">所属项目 / 执行</th>
            <th style="width:90px">当前状态</th>
            <th style="width:90px">操作</th>
          </tr>
        </thead>
        <tbody id="doneTbody">
          <tr><td colspan="9" class="state-placeholder">正在拉取已办记录…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="state-placeholder" id="doneEmpty" hidden>当前条件下没有已办事项</div>
    <div class="state-placeholder error" id="doneError" hidden>
      <span class="error-msg">拉取已办列表失败，请检查网络或重试</span>
      <button type="button" class="retry-btn" id="doneRetryBtn">重试</button>
    </div>
    <div class="workspace-pagination" id="donePagination" hidden></div>
  </section>
</div>


<div id="doneDrawerMask" class="wb-done-drawer-mask" hidden>
  <aside class="wb-done-drawer" role="dialog" aria-modal="true" aria-label="处理记录">
    <header class="wb-done-drawer-hdr">
      <h2>处理记录</h2>
      <button type="button" class="action-btn icon" id="doneDrawerClose" aria-label="关闭">✕</button>
    </header>
    <div class="wb-done-drawer-body" id="doneDrawerBody"></div>
    <footer class="wb-detail-footer">
      <a id="doneDrawerOpenObj" class="action-btn bar" href="#" target="_blank" rel="noopener noreferrer">在禅道打开对象 ↗</a>
      <button type="button" class="action-btn bar" id="doneDrawerCloseBtn">关闭</button>
    </footer>
  </aside>
</div>
