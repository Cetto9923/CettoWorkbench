<div class="po-personal-workspace po-notice">
  <header class="workspace-header">
    <div class="workspace-header-left">
      <h2>通知中心</h2>
      <p>聚合与我有关的业务动态、待处理事项和风险提醒</p>
    </div>
    <div class="header-quick-filters" id="noticeQuickChips" role="group" aria-label="快捷焦点">
      <button type="button" class="header-quick-chip" data-qv="all" aria-pressed="false">全部通知 <em id="qvCountAll">—</em></button>
      <button type="button" class="header-quick-chip active" data-qv="unread" aria-pressed="true">未读 <em id="qvCountUnread">—</em></button>
      <button type="button" class="header-quick-chip" data-qv="action" aria-pressed="false">需处理 <em id="qvCountAction">—</em></button>
      <button type="button" class="header-quick-chip warning" data-qv="abnormal" aria-pressed="false">异常提醒 <em id="qvCountAbnormal">—</em></button>
      <button type="button" class="header-quick-chip" data-qv="today" aria-pressed="false">今日新增 <em id="qvCountToday">—</em></button>
    </div>
  </header>

  <section class="workspace-panel">
    <nav class="category-tabs" aria-label="通知分类">
      <button type="button" class="category-tab active" data-category="all" aria-current="page">全部分类 <em id="categoryAll">—</em></button>
      <button type="button" class="category-tab" data-category="business">业务动态 <em id="categoryBusiness">—</em></button>
      <button type="button" class="category-tab" data-category="approval">审批流程 <em id="categoryApproval">—</em></button>
      <button type="button" class="category-tab" data-category="reminder">时效提醒 <em id="categoryReminder">—</em></button>
      <button type="button" class="category-tab" data-category="collaboration">协作消息 <em id="categoryCollaboration">—</em></button>
      <button type="button" class="category-tab" data-category="risk">风险异常 <em id="categoryRisk">—</em></button>
      <button type="button" class="category-tab" data-category="system">系统消息 <em id="categorySystem">—</em></button>
    </nav>

    <div class="workspace-toolbar">
      <label class="workspace-search"><span aria-hidden="true">⌕</span><input type="search" id="noticeKeyword" placeholder="搜索标题、对象编号或摘要" aria-label="关键词"></label>
      <select id="noticeObjectType" aria-label="关联对象"><option value="all">关联对象：全部</option><option value="demand">业务需求</option><option value="story">研发需求</option><option value="project">项目</option><option value="task">任务</option><option value="bug">Bug</option><option value="testtask">测试单</option><option value="issue">问题</option><option value="risk">风险</option><option value="approval">审批</option><option value="mail">邮件通知</option></select>
      <select id="noticeTimeRange" aria-label="通知时间"><option value="all">通知时间：全部</option><option value="today">今天</option><option value="3d">近 3 天</option><option value="7d">近 7 天</option><option value="30d">近 30 天</option></select>
      <select id="noticeReadState" aria-label="已读状态"><option value="all">已读状态：全部</option><option value="unread">未读</option><option value="read">已读</option></select>
      <select id="noticeNeedAction" aria-label="处理状态"><option value="all">处理状态：全部</option><option value="required">需处理</option><option value="none">仅知会</option></select>
      <button type="button" class="workspace-btn" id="noticeResetBtn">重置筛选</button>
      <button type="button" class="workspace-btn soft-primary" id="noticeMarkAllBtn" title="将当前筛选的全部未读通知标为已读（包含后续页）">全部标为已读</button>
    </div>

    <div class="workspace-result-bar" aria-live="polite">
      <span id="noticeSummary">加载中…</span>
      <span class="workspace-result-hint">批量已读作用于当前筛选的所有页 · 已读不影响业务待办状态</span>
    </div>

    <div class="table-scroll-container">
      <table class="workspace-table notice-table" id="noticeTable">
        <thead>
          <tr>
            <th class="notice-subject">通知内容</th>
            <th class="notice-actor">触发人</th>
            <th class="notice-date">时间</th>
            <th class="notice-state">状态</th>
            <th class="notice-opt">操作</th>
          </tr>
        </thead>
        <tbody id="noticeTbody">
          <tr><td colspan="5" class="state-placeholder">正在拉取通知记录…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="state-placeholder" id="noticeEmpty" hidden>当前条件下没有通知</div>
    <div class="state-placeholder error" id="noticeError" hidden>
      <span class="error-msg">拉取通知列表失败，请检查网络或重试</span>
      <button type="button" class="retry-btn" id="noticeRetryBtn">重试</button>
    </div>
    <div class="workspace-pagination" id="noticePagination" hidden></div>
  </section>
</div>


<div id="noticeDrawerMask" class="notice-drawer-mask" hidden>
  <aside class="notice-drawer" role="dialog" aria-modal="true" aria-label="通知详情">
    <header class="notice-drawer-hdr">
      <h2>通知详情</h2>
      <button type="button" class="action-btn icon" id="noticeDrawerClose" aria-label="关闭">✕</button>
    </header>
    <div class="notice-drawer-body" id="noticeDrawerBody"></div>
    <footer class="notice-drawer-footer">
      <a id="noticeDrawerOpenObj" class="action-btn bar" href="#" target="_blank" rel="noopener noreferrer" hidden>前往关联对象 ↗</a>
      <button type="button" class="action-btn bar" id="noticeDrawerCloseBtn">关闭</button>
    </footer>
  </aside>
</div>
